<button (click)="toggleTickets()">Delete/Add Tickets</button>

@if (displayedTickets.length === 0) {
    <p class="no-tickets">Ticket list is empty.</p>
}

@if (displayedTickets.length > 0) {
    @for (ticket of displayedTickets; track ticket.id) {
    <app-ticket-card>
        <div class="ticket-card">
            <h2 [attr.title]="ticket.description.substring(0, 50) + '...'">
                #{{ ticket.id }} {{ ticket.title }}
            </h2>
            <p><b>Key:</b> {{ ticket.ticketKey }} </p>
            <p><b>Description:</b> {{ ticket.description }}</p>
        </div>
    </app-ticket-card>
    }
}
